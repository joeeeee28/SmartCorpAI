# SmartCorp AI — local full-stack: frontend + backend + postgres(pgvector) + redis + celery
# Usage: docker compose up --build   →  frontend http://localhost:8080 · API http://localhost:8000/api/health/
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartcorp
      POSTGRES_PASSWORD: smartcorp
      POSTGRES_DB: smartcorp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcorp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-not-for-production}
      DEBUG: "False"
      DATABASE_URL: postgres://smartcorp:smartcorp@postgres:5432/smartcorp
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "False"
      ALLOWED_HOSTS: localhost,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - backend-media:/app/media
    ports:
      - "8000:8000"

  celery:
    build: ./backend
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-not-for-production}
      DEBUG: "False"
      DATABASE_URL: postgres://smartcorp:smartcorp@postgres:5432/smartcorp
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "False"
      ALLOWED_HOSTS: localhost,backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    volumes:
      - backend-media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_USE_MOCK: "false"
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  backend-media:
